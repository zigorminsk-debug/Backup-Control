name: Android build and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Опубликовать подписанный APK как новый GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # Pull requests and repositories without a configured key get a clearly
      # labelled debug build, never a release signed with a disposable key.
      - name: Prepare persistent release signing key
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Постоянный ключ подписи не настроен: будет собрана только тестовая debug-версия, без публикации релиза.'
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/backup-control-signing.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/backup-control-signing.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Test and build signed release
        if: steps.signing.outputs.ready == 'true'
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease

      - name: Test and build debug preview
        if: steps.signing.outputs.ready != 'true'
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Prepare signed APK
        if: steps.signing.outputs.ready == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk Backup-Control.apk

      - name: Upload signed APK artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Backup-Control-signed-${{ github.run_number }}
          path: Backup-Control.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK for testing only
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Backup-Control-DEBUG-not-for-updates-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # A push to the default branch publishes an update. A manual run can
      # explicitly publish from another ref, useful for a first release.
      - name: Publish GitHub Release
        if: >-
          steps.signing.outputs.ready == 'true' &&
          ((github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish))
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          gh release create "v${VERSION}" Backup-Control.apk \
            --target "$RELEASE_TARGET" \
            --title "Backup Control ${VERSION}" \
            --generate-notes
