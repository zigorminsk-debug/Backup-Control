name: Android build and release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Опубликовать подписанный APK как новый GitHub Release'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    outputs:
      signed: ${{ steps.signing.outputs.ready }}
    # The hosted image already contains the Android 35 SDK and accepted licenses.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # Pull requests and repositories without a configured key get a clearly
      # labelled debug build, never a release signed with a disposable key.
      - name: Prepare persistent release signing key
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Постоянный ключ подписи не настроен: будет собрана только тестовая debug-версия, без публикации релиза.'
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/backup-control-signing.p12"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Test and build signed release
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/backup-control-signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            python3 -c 'from pathlib import Path; import os; s=Path(os.environ["RUNNER_TEMP"],"gradle.log").read_text(errors="replace")[-18000:]; print("::error::" + s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          }

      - name: Remove release signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/backup-control-signing.p12"

      - name: Test and build debug preview
        if: steps.signing.outputs.ready != 'true'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            python3 -c 'from pathlib import Path; import os; s=Path(os.environ["RUNNER_TEMP"],"gradle.log").read_text(errors="replace")[-18000:]; print("::error::" + s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          }

      - name: Verify release signing configuration with a disposable CI-only key
        if: steps.signing.outputs.ready != 'true'
        shell: bash
        run: |
          STORE_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$STORE_PASS"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$RUNNER_TEMP/ci-only.p12" \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" -alias ci-only -keyalg RSA -keysize 2048 \
            -validity 2 -dname 'CN=Temporary CI test, O=Backup Control' > /dev/null 2>&1
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/ci-only.p12" ANDROID_KEYSTORE_PASSWORD="$STORE_PASS" \
            ANDROID_KEY_ALIAS=ci-only ANDROID_KEY_PASSWORD="$STORE_PASS" \
            ./gradlew --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/ci-only.p12"

      - name: Prepare signed APK
        if: steps.signing.outputs.ready == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk Backup-Control.apk

      - name: Upload signed APK artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Backup-Control-signed-${{ github.run_number }}
          path: Backup-Control.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK for testing only
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Backup-Control-DEBUG-not-for-updates-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ui-smoke:
    # Exercise a real Android 15 device, separately from the release job so
    # the emulator never receives signing secrets or release permissions.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Build two debug APK versions with the same test key
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/initial-debug.apk"
          GITHUB_RUN_NUMBER="$((GITHUB_RUN_NUMBER + 1))" ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/updated-debug.apk"
          cp "$RUNNER_TEMP/initial-debug.apk" app/build/outputs/apk/debug/app-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android UI smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/run_ui_smoke.sh
      - name: Upload UI screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Android-ui-preview-${{ github.run_number }}
          path: ui-smoke.png
          if-no-files-found: ignore
          retention-days: 7

  publish:
    # Never publish until both the signed build and the device tests succeed.
    needs: [android, ui-smoke]
    if: >-
      needs.android.outputs.signed == 'true' &&
      ((github.event_name == 'push' &&
        (github.ref_name == github.event.repository.default_branch ||
         contains(github.event.head_commit.message, '[publish-release]'))) ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download signed APK from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Backup-Control-signed-${{ github.run_number }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          gh release create "v${VERSION}" Backup-Control.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "Backup Control ${VERSION}" \
            --generate-notes
